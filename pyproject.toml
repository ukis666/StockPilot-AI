[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: HTTP and database integration checks"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app", "main", "config", "auth", "account", "api", "commands", "models", "forms", "extensions", "services"]
omit = ["migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
