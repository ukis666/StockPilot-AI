services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    environment:
      DATABASE_URL: sqlite:////data/inventory.db
      MODEL_DIR: /data/models
      UPLOAD_FOLDER: /data/uploads
      STOCKPILOT_INSTANCE: /data
      SECRET_KEY: ${SECRET_KEY:-}
      LLM_URL: ${LLM_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - stockpilot-data:/data
    restart: unless-stopped
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llm]
    command: ["-m", "/models/Qwen3-0.6B-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "--n-gpu-layers", "0", "--threads", "4", "--ctx-size", "2048"]
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
volumes:
  stockpilot-data:
